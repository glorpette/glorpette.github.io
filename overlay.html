<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modern Warfare 4 — OBS Countdown</title>
  <style>
    @font-face {
      font-family: "Hitmarker";
      src: url("HitmarkerNormal-Medium.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "Hitmarker Text";
      src: url("HitmarkerText-Medium.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 16px; color: #f4f5f2; font-family: Arial, sans-serif; }
    [hidden] { display: none !important; }

    .overlay {
      width: min(100%, 480px);
      margin-inline: auto;
      padding: 22px 24px;
      border: 1px solid rgba(255, 208, 0, 0.32);
      border-radius: 18px;
      background-color: rgba(9, 12, 14, 0.78);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(255, 208, 0, 0.075), transparent 75%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 5px),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
      text-align: center;
    }

    h1 { margin: 0; font-family: "Hitmarker Text", Arial, sans-serif; font-size: clamp(16px, 4vw, 21px); font-weight: 500; line-height: 1.3; }
    .timer {
      margin-top: 12px;
      color: #ffd000;
      font-family: "Hitmarker", Arial, sans-serif;
      font-size: clamp(24px, 8vw, 46px);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      white-space: nowrap;
    }

    .subtimer {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 208, 0, 0.2);
      font-size: clamp(12px, 3vw, 15px);
      line-height: 1.4;
    }
    .subtimer output { color: #ffd000; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .timer-parts {
      display: inline-grid;
      grid-template-columns: repeat(3, 2.4em);
      column-gap: 0.4em;
    }
    .timer.timer-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 0.2em; }
    .timer-unit { display: inline-flex; justify-content: center; align-items: baseline; }
    .timer-number { display: inline-flex; justify-content: center; }
    .timer-digit { display: inline-block; width: 0.84em; text-align: center; letter-spacing: 0; }
    .timer-suffix { display: inline-block; width: 1em; margin-left: 0.25em; text-align: center; }
    .timer .timer-suffix { font-family: "Hitmarker Text", Arial, sans-serif; font-size: 0.45em; }
    .subtimer .timer-digit { width: 0.62em; }
    .subtimer .timer-suffix { width: 1em; margin-left: 0.12em; }
    .is-live { animation: live-glow 3.5s ease-in-out infinite; }
    @keyframes live-glow {
      0%, 100% { text-shadow: 0 0 5px rgba(255, 208, 0, 0.12); }
      50% { text-shadow: 0 0 14px rgba(255, 208, 0, 0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .is-live { animation: none; }
    }

    @media (max-width: 380px) {
      body { padding: 10px; }
      .overlay { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <main class="overlay" aria-label="Launch countdown">
    <h1 id="name">Launch countdown</h1>
    <div class="timer" id="timer" role="timer" aria-live="off" hidden></div>
    <div class="subtimer" id="subtimer" hidden>
      <span>Day 0 update</span>
      <output id="subtimer-value" role="timer" aria-live="off"></output>
    </div>
  </main>
  <script>
    (() => {
      const name = document.getElementById("name");
      const timer = document.getElementById("timer");
      const subtimer = document.getElementById("subtimer");
      const subtimerValue = document.getElementById("subtimer-value");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const animateChange = (element) => {
        if (reducedMotion.matches) return;
        element.getAnimations().forEach((animation) => animation.cancel());
        element.animate([
          { opacity: 0.55, transform: "translateY(-3px)" },
          { opacity: 1, transform: "translateY(0)" }
        ], { duration: 240, easing: "ease-out" });
      };
      const renderTimer = (element, text) => {
        const live = text === "LIVE NOW!";
        element.classList.toggle("is-live", live);
        element.classList.toggle("timer-parts", !live);
        if (element.textContent === text) return;
        if (live) {
          element.textContent = text;
          return;
        }
        const parts = text.match(/^(\d+)h (\d+)m (\d+)s$/).slice(1);
        if (!element.querySelector(".timer-unit")) {
          element.replaceChildren(...["h", "m", "s"].map((unit, index) => {
            const group = document.createElement("span");
            group.className = "timer-unit";
            const number = document.createElement("span");
            number.className = "timer-number";
            const suffix = document.createElement("span");
            suffix.className = "timer-suffix";
            suffix.textContent = unit;
            group.append(number, suffix);
            if (index < 2) group.append(document.createTextNode(" "));
            return group;
          }));
        }
        parts.forEach((part, index) => {
          const number = element.querySelectorAll(".timer-number")[index];
          if (number.childNodes.length !== part.length) {
            number.replaceChildren(...[...part].map((character) => {
              const digit = document.createElement("span");
              digit.className = "timer-digit";
              digit.textContent = character;
              return digit;
            }));
            return;
          }
          [...part].forEach((character, digitIndex) => {
            const digit = number.childNodes[digitIndex];
            if (digit.textContent === character) return;
            digit.textContent = character;
            animateChange(digit);
          });
        });
      };
      const liveDuration = 60 * 60 * 1000;
      let audioContext;
      const prepareAudio = () => {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          return audioContext;
        } catch {
          return null;
        }
      };
      const playLaunchCue = async () => {
        const context = prepareAudio();
        if (!context) return;
        const triggeredAt = Date.now();
        try {
          if (context.state === "suspended") await context.resume();
          // Never play an old cue later if browser autoplay was blocked.
          if (context.state !== "running" || Date.now() - triggeredAt > 5000) return;
          const cueStart = context.currentTime;
          // Five gentle pairs, with space between them and a fading final pair.
          Array.from({ length: 10 }, (_, index) => index).forEach((index) => {
            const repeat = Math.floor(index / 2);
            const frequency = index % 2 === 0 ? 523.25 : 659.25;
            const start = cueStart + repeat * 1.6 + (index % 2) * 0.32;
            const tone = context.createOscillator();
            const volume = context.createGain();
            tone.type = "sine";
            tone.frequency.value = frequency;
            volume.gain.setValueAtTime(0, start);
            const peak = repeat === 4 ? 0.025 : 0.045;
            volume.gain.linearRampToValueAtTime(peak, start + 0.05);
            volume.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
            volume.gain.linearRampToValueAtTime(0, start + 0.65);
            tone.connect(volume);
            volume.connect(context.destination);
            tone.onended = () => { tone.disconnect(); volume.disconnect(); };
            tone.start(start);
            tone.stop(start + 0.65);
          });
        } catch {
          // A muted or unavailable audio device must not interrupt the timer.
        }
      };
      // OBS allows autoplay; a normal browser may need an interaction first.
      document.addEventListener("pointerdown", () => {
        prepareAudio()?.resume().catch(() => {});
      });
      const pad = (value) => String(value).padStart(2, "0");
      const format = (target, now) => {
        const seconds = Math.ceil((target - now) / 1000);
        return `${pad(Math.floor(seconds / 3600))}h ${pad(Math.floor((seconds % 3600) / 60))}m ${pad(seconds % 60)}s`;
      };

      // Read the main page so launch dates and milestone order stay in sync.
      fetch("index.html", { cache: "no-cache" })
        .then((response) => {
          if (!response.ok) throw new Error("Unable to load launch times");
          return response.text();
        })
        .then((html) => {
          const source = new DOMParser().parseFromString(html, "text/html");
          const releases = [...source.querySelectorAll("[data-countdown]")].map((card) => ({
            name: card.querySelector("h2").textContent,
            target: Date.parse(card.dataset.target),
            subtarget: Date.parse(card.querySelector("[data-update-countdown]")?.dataset.target)
          })).filter((release) => Number.isFinite(release.target));
          if (!releases.length) throw new Error("No launch times found");

          let intervalId;
          let previousNow = null;
          const playedTargets = new Set();
          const update = () => {
            const now = Date.now();
            const current = releases.find((release) => release.target + liveDuration > now) || releases[releases.length - 1];
            timer.hidden = false;
            subtimer.hidden = !Number.isFinite(current.subtarget) || now >= current.subtarget + liveDuration;
            if (name.textContent !== current.name) {
              name.textContent = current.name;
              animateChange(name);
            }
            renderTimer(timer, now >= current.target ? "LIVE NOW!" : format(current.target, now));
            if (!subtimer.hidden) {
              renderTimer(subtimerValue, now >= current.subtarget ? "LIVE NOW!" : format(current.subtarget, now));
            }
            const reachedTargets = [current.target, current.subtarget].filter((target) =>
              previousNow !== null && previousNow < target && now >= target &&
              now < target + liveDuration && !playedTargets.has(target)
            );
            if (reachedTargets.length) {
              reachedTargets.forEach((target) => playedTargets.add(target));
              void playLaunchCue();
            }
            previousNow = now;
            if (releases.every((release) => now >= release.target + liveDuration)) {
              window.clearInterval(intervalId);
            }
          };

          update();
          if (releases.some((release) => release.target + liveDuration > Date.now())) {
            intervalId = window.setInterval(update, 1000);
          }
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) update();
          });
        })
        .catch(() => { name.textContent = "Countdown unavailable"; });
    })();
  </script>
</body>
</html>
